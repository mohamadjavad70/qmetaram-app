workflows:
  ios-build:
    name: iOS Build (Debug)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      ios_signing:
        distribution_type: development
        bundle_identifier: com.qmetaram.qmetaram
      node: 22
      xcode: latest
    scripts:
      - name: Install dependencies
        script: |
          cd ../qhub && npm ci || npm install
      - name: Build web assets
        script: |
          cd ../qhub && npm run build
      - name: Sync Capacitor
        script: |
          npm install
          npx cap sync ios
      - name: Build iOS
        script: |
          xcode-project use-profiles
          xcode-project build-ipa \
            --project ios/App/App.xcodeproj \
            --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - your-email@example.com
        notify:
          success: true
          failure: true
