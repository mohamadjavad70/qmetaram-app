<script>
(function(){
  function qHideBanner(remember){
    var b = document.getElementById('q-app-bar');
    if (b) b.remove();
    if (remember) { try { localStorage.setItem('q-banner-seen', '1'); } catch(e){} }
  }
  window.qHideBanner = qHideBanner;

  var path = location.pathname || '';
  if (path.indexOf('/chat') === 0 || path.indexOf('/chat/') === 0) return;
  if (window.innerWidth >= 1025) return;
  try { if (localStorage.getItem('q-banner-seen') === '1') return; } catch(e){}

  var b = document.getElementById('q-app-bar');
  if (b) b.style.display = '';

  var timer = setTimeout(function(){
    try { localStorage.setItem('q-banner-seen', '1'); } catch(e){}
  }, 8000);

  var btns = document.querySelectorAll('#q-app-bar a');
  for (var i = 0; i < btns.length; i++) {
    btns[i].addEventListener('click', function(){
      clearTimeout(timer);
      try { localStorage.setItem('q-banner-seen', '1'); } catch(e){}
    });
  }
})();
</script>
